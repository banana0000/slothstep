services:
  - type: web
    name: slothstep
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --timeout 120
    plan: free
    envVars:
      # Demo mode shows canned plans. Set DEMO_MODE to false and fill in the
      # LLM_* variables below to use a hosted open-weight model instead.
      - key: DEMO_MODE
        value: "true"
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        sync: false
