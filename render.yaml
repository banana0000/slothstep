services:
  # Free web service running in demo mode (canned plans, no model needed).
  # To use a real model, set DEMO_MODE to "false" and either point
  # LLM_BASE_URL / LLM_API_KEY / OLLAMA_MODEL at a hosted open-weight model,
  # or add a private Ollama service (see ollama/Dockerfile, needs a paid plan)
  # and set OLLAMA_URL to it.
  - type: web
    name: slothstep
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --timeout 180
    plan: free
    envVars:
      - key: DEMO_MODE
        value: "true"
