services:
  - type: web
    name: slothstep
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --timeout 120
    plan: free
    envVars:
      # Any OpenAI-compatible host serving an open-weight model (free tiers exist).
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        sync: false
