services:
  # Open-weight model server (private, only the web app can reach it)
  - type: pserv
    name: slothstep-ollama
    runtime: docker
    dockerfilePath: ./ollama/Dockerfile
    dockerContext: ./ollama
    plan: standard   # 2 GB RAM: enough for gemma3:1b
    disk:
      name: ollama-models
      mountPath: /root/.ollama
      sizeGB: 5
    envVars:
      - key: OLLAMA_MODEL
        value: gemma3:1b

  - type: web
    name: slothstep
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --timeout 180
    plan: free
    envVars:
      - key: OLLAMA_MODEL
        value: gemma3:1b
      - key: OLLAMA_URL
        fromService:
          type: pserv
          name: slothstep-ollama
          property: hostport
